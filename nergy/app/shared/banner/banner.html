<header class="banner" [class.menu-open]="menuOpen">
  <div class="brand-row">
    <div class="brand">
      <a routerLink="/" aria-label="Nergy home" (click)="closeMenu()">
        <img [src]="brandImage" alt="Nergy logo" />
      </a>
    </div>

    <button
      class="menu-toggle"
      type="button"
      aria-label="Toggle navigation menu"
      [attr.aria-expanded]="menuOpen"
      aria-controls="mobile-nav"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <nav class="nav-links desktop-nav" aria-label="Primary navigation">
    <a routerLink="/sale" class="sale-badge">SALE</a>
    <a routerLink="/home">Home</a>
    <a routerLink="/wicks">Wicks</a>
    <a routerLink="/sprays">Sprays</a>
    <a routerLink="/body">Body</a>
  </nav>
</header>

<div
  class="mobile-drawer-backdrop"
  [class.open]="menuOpen"
  (click)="closeMenu()"
></div>

<nav
  id="mobile-nav"
  class="mobile-drawer"
  [class.open]="menuOpen"
  aria-label="Mobile navigation"
>
  <div class="mobile-drawer-header">
    <span class="mobile-drawer-title">Menu</span>

    <button
      class="mobile-close"
      type="button"
      aria-label="Close navigation menu"
      (click)="closeMenu()"
    >
      <span></span>
      <span></span>
    </button>
  </div>

  <div class="mobile-drawer-links">
    <a routerLink="/sale" class="sale-badge" (click)="closeMenu()">SALE</a>
    <a routerLink="/home" (click)="closeMenu()">Home</a>
    <a routerLink="/wicks" (click)="closeMenu()">Wicks</a>
    <a routerLink="/sprays" (click)="closeMenu()">Sprays</a>
    <a routerLink="/body" (click)="closeMenu()">Body</a>
  </div>
</nav>
