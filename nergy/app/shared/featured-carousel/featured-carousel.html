<section
  class="featured-banner"
  [style.--slide-color]="slides[activeIndex]?.color || 'rgba(255, 110, 180, 0.18)'"
>
  <button
    type="button"
    class="carousel-arrow carousel-arrow-left"
    title="Previous slide"
    (click)="prev()"
  >
    &#8592;
  </button>

  <div class="featured-banner-inner" [class.is-transitioning]="isTransitioning">
    <p class="featured-kicker">{{ slides[activeIndex]?.label }}</p>
    <h2>{{ slides[activeIndex]?.headline }}</h2>
    <p class="featured-sub">{{ slides[activeIndex]?.sub }}</p>

    <a
      class="btn btn-primary"
      [routerLink]="slides[activeIndex]?.ctaLink"
    >
      {{ slides[activeIndex]?.ctaLabel }}
    </a>
  </div>

  <button
    type="button"
    class="carousel-arrow carousel-arrow-right"
    title="Next slide"
    (click)="next()"
  >
    &#8594;
  </button>

  <div class="carousel-dots">
    <button
      *ngFor="let slide of slides; let i = index"
      type="button"
      class="carousel-dot"
      [class.active]="i === activeIndex"
      [title]="'Go to slide ' + (i + 1)"
      (click)="goTo(i)"
    ></button>
  </div>

  <div class="carousel-placeholder-label">
    [ PLACEHOLDER {{ activeIndex + 1 }} ]
  </div>
</section>
