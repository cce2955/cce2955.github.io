<div class="page page-enter">


  <app-hero-banner [config]="heroBanner">
    <app-sparkle-logo
      slot="logo"
      src="nergytransparent.PNG"
      alt="nergy logo"
    ></app-sparkle-logo>

    <div slot="visual" class="candle-card bordered-panel">
      <div class="flame"></div>
      <div class="jar"></div>
      <p class="label">Premium Wick Kit</p>
    </div>
  </app-hero-banner>
<app-featured-carousel [slides]="slides"></app-featured-carousel>
  <app-highlight-reel
    [items]="highlights"
    heading="Why Wicks"
  ></app-highlight-reel>
</div>
